<style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; font-family: 'Inter', sans-serif; }
        
        #bg-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            width: 100dvw; height: 100dvh;
            background-image: url('https://lh3.googleusercontent.com/d/1bKwo9aPZAHycqFZk7XGBf2jUaTiOLBpM');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center center;
            opacity: 0.8; z-index: 1; filter: brightness(0.8);
        }

        #video-element {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: 2; transform: scaleX(-1);
            opacity: 0.45;
        }

        #game-canvas {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10;
        }

        /* New layer specifically for animated GIFs */
        #gif-layer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 15;
            pointer-events: none; /* Let all clicks pass through to the canvas */
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.5);
        }

        /* สไตล์หน้า Loading พื้นหลังผ้าขาว */
        #loading-screen {
    position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
    background-color: #ffffff; /* เปลี่ยนเป็นสีขาวเรียบ */
    z-index: 50; display: flex; flex-direction: column;
    justify-content: center; align-items: center; 
    color: #1e293b; /* เปลี่ยนสีข้อความพื้นฐานเป็นสีเทาเข้ม */
    transition: opacity 0.6s ease;
}

        /* สไตล์สำหรับโลโก้หน้า Loading */
        .logo-loader-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* เอฟเฟกต์ย่อขยายจังหวะหัวใจ + เปล่งแสงเรืองรองโทนเขียวอ่อน */
        .logo-pulse {
            animation: logoPulse 1.8s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0% {
                transform: scale(0.96);
                filter: drop-shadow(0 0 10px rgba(132, 204, 22, 0.4));
            }
            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 25px rgba(132, 204, 22, 0.85));
            }
            100% {
                transform: scale(0.96);
                filter: drop-shadow(0 0 10px rgba(132, 204, 22, 0.4));
            }
        }

        /* สไตล์สำหรับโลโก้หน้า Loading */
        .logo-loader-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* เอฟเฟกต์ย่อขยายจังหวะหัวใจ + เปล่งแสงเรืองรองโทนเขียวอ่อน */
        .logo-pulse {
            animation: logoPulse 1.8s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0% {
                transform: scale(0.96);
                filter: drop-shadow(0 0 10px rgba(132, 204, 22, 0.4));
            }
            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 25px rgba(132, 204, 22, 0.85));
            }
            100% {
                transform: scale(0.96);
                filter: drop-shadow(0 0 10px rgba(132, 204, 22, 0.4));
            }
        }
    </style>
</head>
<body>

    <!-- DOM Layer for GIF Animations -->
    <div id="gif-layer"></div>

    <!-- Loading Screen -->

    <!-- Loading Screen -->
    <!-- Loading Screen -->
    <!-- Loading Screen แบบใช้โลโก้ 72 ปี -->
    <div id="loading-screen">
        <!-- โลโก้ 72 ปี พร้อมเอฟเฟกต์ย่อขยาย+เปล่งแสงนุ่มนวล -->
        <div class="logo-loader-wrapper mb-6">
            <img src="https://lh3.googleusercontent.com/d/1LGwyhSfllv05hYqQyr86Z7PFCO1g2AaJ" alt="72th Anniversary Logo" class="logo-pulse w-44 h-auto drop-shadow-xl">
        </div>
        <h1 class="text-3xl font-extrabold tracking-widest bg-gradient-to-r from-[#0d3b1e] via-[#166534] to-[#4ade80] bg-clip-text text-transparent mb-2 drop-shadow-lg">KS INTER HOUSE 2026</h1>
        <p class="text-[#0e4d25] text-sm tracking-wide font-bold" id="load-text">กำลังเตรียมระบบ 5 สัตว์ในตำนาน... 0%</p>
        <p class="text-slate-500 text-xs mt-4">กรุณาอนุญาตการใช้งานกล้องเพื่อเริ่มเล่นเกม</p>

    <!-- Hand Tracking Status Alert -->
    <div id="tracking-alert" class="absolute top-4 right-4 z-20 glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-3 transition-all duration-300">
        <div id="tracking-dot" class="w-3.5 h-3.5 rounded-full bg-rose-500 animate-ping"></div>
        <div>
            <p id="tracking-text" class="text-white text-xs font-semibold tracking-wide">กำลังหามือ...</p>
            <p class="text-slate-400 text-[10px]">ชูมือหน้ากล้องเพื่อควบคุมแบบ AR</p>

    <!-- AI Companion Chat Widget -->
    <div class="absolute bottom-6 left-6 z-20 flex flex-col items-start gap-2">
        <div id="ai-chat-box" class="glass-panel hidden w-72 p-4 rounded-2xl text-white text-xs shadow-2xl border-cyan-500/40">
            <div class="flex justify-between items-center mb-2 border-b border-white/10 pb-1">
                <span class="font-bold text-cyan-400 flex items-center gap-1">🤖 KS AI Assistant</span>
                <button onclick="toggleAIChat()" class="text-slate-400 hover:text-white">&times;</button>
            </div>
            <p id="ai-response-text" class="text-slate-200 leading-relaxed">ลากสัตว์วิเศษทั้ง 5 ตัวที่เรียงอยู่กลางจอมาใส่ใน 5 แท่นบูชาด้านล่างเพื่อปลุกพลังแห่งชัยชนะ!</p>
        </div>
        <button onclick="toggleAIChat()" class="glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-2 text-white text-xs font-bold hover:bg-cyan-500/25 transition-all border-cyan-500/50 shadow-lg">
            <span>💬 ผู้ช่วย AI</span>
        </button>
    </div>

    <script>
        const TOTAL_BEASTS = 5;
        const ASSET_URLS = {
            beast1: 'https://lh3.googleusercontent.com/d/1uOAjEDe2CcQtYu1DEMUkTenMs0rdS66G', // แก้ไข path หรือ URL ของ beast 1 ที่นี่
            beast2: 'https://lh3.googleusercontent.com/d/1IaI0WUrUyHf13wPDNgFDbEJa9U1uJAKr', // แก้ไข path หรือ URL ของ beast 2 ที่นี่
            beast3: 'https://lh3.googleusercontent.com/d/1KQ_zo0v8xVwwvtn88J1e8BRahHUzM4b7', // แก้ไข path หรือ URL ของ beast 3 ที่นี่
            beast4: 'https://lh3.googleusercontent.com/d/1GXxuK1tYF6_m6gbilCz9OmzDcAOUhoiH', // แก้ไข path หรือ URL ของ beast 4 ที่นี่
            beast5: 'https://lh3.googleusercontent.com/d/1VNcrPmmHpmrp_KimJxW3pktMFKJweUNP', // แก้ไข path หรือ URL ของ beast 5 ที่นี่
            victoryImg: 'https://lh3.googleusercontent.com/d/15sLqO_PrKKu2LaT8q6izYAeW9ZW77ZKM'
        };

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const videoElement = document.getElementById('video-element');
        const gifLayer = document.getElementById('gif-layer');
        
        let vw = window.innerWidth;
        let vh = window.innerHeight;
        
        let domImages = {}; // Store the HTML <img> elements for GIFs
        let imagesLoaded = 0;
        
        let gameState = 'loading'; // loading, playing, victory
        let camera = null;
        let hands = null;
        let lastTime = 0;

        let altars = []; 
        let beasts = [];
        let particles = [];
        let score = 0;
        let draggedBeast = null;
        
        let cursor = { x: -100, y: -100, isPinching: false, isHovering: false, hasTarget: false };
        let isHandDetected = false;
        let latestHandLandmarks = null;

        let victoryObj = {
            active: false,
            x: vw / 2, y: vh, targetY: vh / 2,
            scale: 0.1, maxScale: 1.6, opacity: 0
        };

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        function playChime(volume = 0.4) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        }

        function playLoudTripleExplosion() {
            playChime(1.0);
            createExplosion(vw / 2, vh / 2, 80, ['#FFFFFF', '#FFD700', '#FF4500']);
            setTimeout(() => {
                playChime(1.2);
                createExplosion(vw / 2 - 100, vh / 2 - 50, 80, ['#00FFFF', '#FF1493', '#FFA500']);
            }, 300);
            setTimeout(() => {
                playChime(1.5);
                createExplosion(vw / 2 + 100, vh / 2 + 50, 100, ['#32CD32', '#FF4500', '#FFFF00']);
            }, 600);
        }

        function toggleAIChat() {
            const box = document.getElementById('ai-chat-box');
            box.classList.toggle('hidden');
        }

        class Beast {
            constructor(id, imgKey, initialX, initialY) {
                this.id = id;
                this.imgKey = imgKey;
                
                let baseSize = Math.min(vw, vh) * 0.14;
                if(baseSize < 80) baseSize = 80;
                if(baseSize > 125) baseSize = 125;
                this.size = baseSize * 2.8; 
                
                this.x = initialX;
                this.y = initialY;
                
                this.baseX = this.x;
                this.baseY = this.y;

                this.isDragged = false;
                this.isCaptured = false;
                this.opacity = 1;
                this.scale = 1;
            }

            update(dt, time) {
                if (this.isCaptured) return;
                
                if (this.isDragged) {
                    this.x += (cursor.x - this.x) * 0.25;
                    this.y += (cursor.y - this.y) * 0.25;
                } else {
                    this.x = this.baseX;
                    this.y = this.baseY;
                }
            }

            // Syncs the underlying DOM <img> with the game coordinates
            drawDOM(time = 0) {
                const imgEl = domImages[this.imgKey];
    if (!imgEl || this.opacity <= 0) return;

    imgEl.classList.remove('hidden');
    
    // กำหนดขนาดนิ่งๆ (ขยาย 1.25 เท่าเฉพาะตอนกำลังถูกลาก)
    const currentScale = this.isDragged ? this.scale * 1.25 : this.scale;
    
    imgEl.style.width = `${this.size}px`;
    imgEl.style.height = `${this.size}px`;
    imgEl.style.transform = `translate(${this.x - this.size/2}px, ${this.y - this.size/2}px) scale(${currentScale})`;
    imgEl.style.opacity = this.opacity;
    
    if (this.isDragged) {
        imgEl.style.filter = 'drop-shadow(0px 15px 25px rgba(52, 211, 153, 0.95))';
    } else {
        imgEl.style.filter = 'drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.75))';
                }
            }

            contains(x, y) {
                const dx = this.x - x;
                const dy = this.y - y;
                return Math.sqrt(dx*dx + dy*dy) < (this.size * 0.55);
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = (Math.random() - 0.5) * 12 - 3;
                this.life = 1.0;
                this.decay = 0.01 + Math.random() * 0.015;
                this.color = color;
                this.size = Math.random() * 6 + 3;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.vy += 0.12; this.life -= this.decay;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color; ctx.shadowBlur = 12;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill(); ctx.globalAlpha = 1;
            }
        }

        function resizeCanvas() {
            vw = window.innerWidth; vh = window.innerHeight;
            canvas.width = vw; canvas.height = vh;
            
            altars = [];
            const totalSlots = 5;
            const slotW = Math.min(180, vw * 0.18);
            const slotH = slotW;
            const gap = 14;
            const totalWidth = (totalSlots * slotW) + ((totalSlots - 1) * gap);
            const startX = (vw - totalWidth) / 2;
            const startY = vh - slotH - 35;

            for(let i=0; i<totalSlots; i++) {
                altars.push({
                    id: i + 1, x: startX + i * (slotW + gap), y: startY, w: slotW, h: slotH,
                    filled: false, beastKey: null
                });
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createExplosion(x, y, count, colors = ['#06B6D4', '#3B82F6', '#F59E0B', '#34D399', '#FFFFFF']) {
            for(let i=0; i<count; i++) {
                particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
            }
        }

        function preloadAssets() {
            const keys = Object.keys(ASSET_URLS);
            const loadText = document.getElementById('load-text');
            
            keys.forEach(key => {
                // Instead of Canvas Image, create an actual DOM element for GIF support
                const imgEl = document.createElement('img');
                imgEl.src = ASSET_URLS[key];
                imgEl.className = 'absolute top-0 left-0 origin-center hidden';
                imgEl.style.transition = 'transform 0.05s ease-out, filter 0.2s';
                
                gifLayer.appendChild(imgEl);
                domImages[key] = imgEl;

                imgEl.onload = () => {
                    imagesLoaded++;
                    loadText.innerText = `กำลังเตรียมระบบ 5 สัตว์ในตำนาน... ${Math.floor((imagesLoaded/keys.length)*100)}%`;
                    checkAllLoaded(keys.length);
                };
                imgEl.onerror = () => {
                    console.error(`Asset load error: ${key}`);
                    imagesLoaded++;
                    checkAllLoaded(keys.length);
                };
            });
        }

        function checkAllLoaded(total) {
            if (imagesLoaded === total) {
                setTimeout(() => {
                    const loadingScreen = document.getElementById('loading-screen');
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => loadingScreen.style.display = 'none', 600);
                    
                    initGame();
                    initMediaPipe();
                    gameState = 'playing';
                    requestAnimationFrame(drawLoop);
                }, 400);
            }
        }

        function initGame() {
            beasts = []; particles = []; score = 0; draggedBeast = null;
            victoryObj.active = false;
            
            altars.forEach(slot => { slot.filled = false; slot.beastKey = null; });

            const totalBeasts = TOTAL_BEASTS;
            const spacing = vw / (totalBeasts + 1);
            const centerY = vh * 0.42;

            for (let i = 1; i <= totalBeasts; i++) {
                beasts.push(new Beast(i, `beast${i}`, spacing * i, centerY));
            }
        }

        function checkInteractions() {
            cursor.isHovering = false;
            cursor.hasTarget = draggedBeast !== null;

            if (draggedBeast) {
                if (!cursor.isPinching) {
                    let targetSlot = null;
                    for (let slot of altars) {
                        if (!slot.filled && 
                            cursor.x > slot.x && cursor.x < slot.x + slot.w &&
                            cursor.y > slot.y && cursor.y < slot.y + slot.h) {
                            targetSlot = slot; break;
                        }
                    }

                    if (targetSlot) {
                        targetSlot.filled = true;
                        targetSlot.beastKey = draggedBeast.imgKey;
                        draggedBeast.isCaptured = true;
                        draggedBeast.x = targetSlot.x + targetSlot.w / 2;
                        draggedBeast.y = targetSlot.y + targetSlot.h / 2;
                        
                        createExplosion(cursor.x, cursor.y, 50);
                        score++;
                        
                        if(score >= TOTAL_BEASTS) {
                            playLoudTripleExplosion(); triggerVictory();
                        } else {
                            playChime(0.5);
                        }
                    } else {
                        draggedBeast.baseX = draggedBeast.x;
                        draggedBeast.baseY = draggedBeast.y;
                    }
                    draggedBeast.isDragged = false;
                    draggedBeast = null;
                }
            } else {
                for (let i = beasts.length - 1; i >= 0; i--) {
                    let b = beasts[i];
                    if (!b.isCaptured && b.contains(cursor.x, cursor.y)) {
                        cursor.isHovering = true;
                        if (cursor.isPinching) {
                            b.isDragged = true; draggedBeast = b; break;
                        }
                    }
                }
            }
        }

        function triggerVictory() {
            gameState = 'victory';
            victoryObj.active = true;
            victoryObj.y = vh / 2 - 40; victoryObj.x = vw / 2;
            victoryObj.scale = 0.1; victoryObj.opacity = 0;
            
            // Hide beasts when victory triggers
            beasts.forEach(b => b.opacity = 0);
        }

        function initMediaPipe() {
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });
            
            hands.setOptions({
                maxNumHands: 1, modelComplexity: 1,
                minDetectionConfidence: 0.65, minTrackingConfidence: 0.65
            });

            hands.onResults((results) => {
                const trackingDot = document.getElementById('tracking-dot');
                const trackingText = document.getElementById('tracking-text');

                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    isHandDetected = true;
                    latestHandLandmarks = results.multiHandLandmarks[0];
                    
                    trackingDot.classList.replace('bg-rose-500', 'bg-emerald-500');
                    trackingDot.classList.remove('animate-ping');
                    trackingText.innerText = 'เชื่อมต่อมือสำเร็จ (Hand AR Active)';

                    const indexTip = latestHandLandmarks[8];
                    const thumbTip = latestHandLandmarks[4];

                    cursor.x = (1 - indexTip.x) * vw;
                    cursor.y = indexTip.y * vh;

                    const pThumbX = (1 - thumbTip.x) * vw;
                    const pThumbY = thumbTip.y * vh;
                    const dx = cursor.x - pThumbX;
                    const dy = cursor.y - pThumbY;
                    
                    cursor.isPinching = Math.sqrt(dx*dx + dy*dy) < 45;
                } else {
                    isHandDetected = false; latestHandLandmarks = null;
                    if(!draggedBeast) cursor.isPinching = false;
                    
                    trackingDot.classList.replace('bg-emerald-500', 'bg-rose-500');
                    trackingDot.classList.add('animate-ping');
                    trackingText.innerText = 'กำลังหามือ (ใช้เมาส์/นิ้วแตะแทนได้)';
                }
            });

            camera = new Camera(videoElement, {
                onFrame: async () => { await hands.send({image: videoElement}); },
                width: 640, height: 480
            });
            camera.start().catch(err => console.warn("Camera fallback:", err));
        }

        function handlePointerMove(e) {
            if(isHandDetected) return;
            cursor.x = e.touches ? e.touches[0].clientX : e.clientX;
            cursor.y = e.touches ? e.touches[0].clientY : e.clientY;
        }
        function handlePointerDown(e) {
            if(isHandDetected) return;
            handlePointerMove(e); cursor.isPinching = true;
        }
        function handlePointerUp(e) {
            if(isHandDetected) return; cursor.isPinching = false;
        }

        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mouseup', handlePointerUp);
        window.addEventListener('touchmove', handlePointerMove, {passive: false});
        window.addEventListener('touchstart', handlePointerDown, {passive: false});
        window.addEventListener('touchend', handlePointerUp);

        function drawAltars(time) {
            altars.forEach((slot, index) => {
                ctx.save();
                ctx.fillStyle = slot.filled ? 'rgba(16, 185, 129, 0.3)' : 'rgba(15, 23, 42, 0.85)';
                ctx.strokeStyle = slot.filled ? '#34D399' : `rgba(6, 182, 212, ${0.5 + Math.sin(time*0.006 + index)*0.3})`;
                ctx.lineWidth = 3.5;
                
                ctx.shadowColor = slot.filled ? 'rgba(52, 211, 153, 0.7)' : 'rgba(6, 182, 212, 0.6)';
                ctx.shadowBlur = 20;
                
                ctx.beginPath(); ctx.roundRect(slot.x, slot.y, slot.w, slot.h, 18);
                ctx.fill(); ctx.stroke();

                if (!slot.filled) {
                    ctx.fillStyle = '#93C5FD'; ctx.shadowBlur = 4; ctx.shadowColor = 'rgba(0,0,0,0.8)';
                    ctx.font = 'bold 18px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(`${slot.id}`, slot.x + slot.w/2, slot.y + slot.h/2);
                }
                ctx.restore();
            });

            ctx.save();
            ctx.font = 'bold 16px Inter'; ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'center'; ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 6;
            ctx.fillText(`✨ 5 สัตว์ในตำนานแห่ง KS INTER HOUSE 2026 (${score}/${TOTAL_BEASTS}) ✨`, vw / 2, altars[0].y - 18);
            ctx.restore();
        }

        function drawCursor(time) {
            ctx.save(); ctx.lineWidth = 3;
            if (draggedBeast) {
                ctx.strokeStyle = '#22C55E'; ctx.fillStyle = 'rgba(34, 197, 94, 0.25)';
                ctx.shadowColor = '#22C55E'; ctx.shadowBlur = 18;
                ctx.beginPath(); ctx.arc(cursor.x, cursor.y, 28, 0, Math.PI*2);
                ctx.fill(); ctx.stroke();
                
                ctx.fillStyle = '#fff'; ctx.font = '18px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText('🎯', cursor.x, cursor.y);
            } else if (cursor.isHovering) {
                ctx.strokeStyle = '#F59E0B'; ctx.setLineDash([6, 6]);
                ctx.beginPath(); ctx.arc(cursor.x, cursor.y, 26 + Math.sin(time * 0.012) * 6, 0, Math.PI*2);
                ctx.stroke();
            } else if (cursor.isPinching) {
                ctx.strokeStyle = '#EF4444'; ctx.fillStyle = 'rgba(239, 68, 68, 0.3)';
                ctx.beginPath(); ctx.arc(cursor.x, cursor.y, 22, 0, Math.PI*2);
                ctx.fill(); ctx.stroke();
            } else {
                ctx.strokeStyle = '#06B6D4'; ctx.fillStyle = 'rgba(6, 182, 212, 0.15)';
                ctx.beginPath(); ctx.arc(cursor.x, cursor.y, 16, 0, Math.PI*2);
                ctx.fill(); ctx.stroke();
            }
            ctx.restore();
        }

        function drawLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = Math.min(timestamp - lastTime, 50);
            lastTime = timestamp;

            ctx.clearRect(0, 0, vw, vh);

            if (gameState === 'playing' || gameState === 'victory') {
                checkInteractions();
                drawAltars(timestamp);

                // Update physical coordinates and DOM Overlay for GIFs
                beasts.forEach(b => {
                    b.update(dt, timestamp);
                    b.drawDOM(timestamp);
                });

                // Handle Victory GIF animation
                const vImg = domImages['victoryImg'];
                if (victoryObj.active && vImg) {
                    vImg.classList.remove('hidden');
                    victoryObj.y += (victoryObj.targetY - victoryObj.y) * 0.03;
                   victoryObj.scale += (victoryObj.maxScale - victoryObj.scale) * 0.03;
                    if (victoryObj.opacity < 1) victoryObj.opacity += 0.02;
                    
                    const vSize = 500;
                    vImg.style.width = `${vSize}px`;
                    vImg.style.height = `${vSize}px`;
                    const bounceY = Math.sin(timestamp * 0.0035) * 22;
                    vImg.style.transform = `translate(${victoryObj.x - vSize/2}px, ${victoryObj.y + bounceY - vSize/2}px) scale(${victoryObj.scale})`;
                    vImg.style.opacity = victoryObj.opacity;
                    vImg.style.filter = 'drop-shadow(0px 20px 35px rgba(245, 158, 11, 0.8))';
                    
                    if(Math.random() < 0.15) {
                        createExplosion(Math.random()*vw, Math.random()*(vh*0.7), 25, ['#10B981', '#EF4444', '#F59E0B', '#3B82F6', '#EC4899', '#FFFFFF']);
                    }
                } else if (vImg) {
                    vImg.classList.add('hidden');
                }

                // Draw Particle Explosions on Canvas
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i]; p.update(); p.draw(ctx);
                    if (p.life <= 0) particles.splice(i, 1);
                }

                if (cursor.x > -50 && cursor.y > -50) drawCursor(timestamp);
            }

            requestAnimationFrame(drawLoop);
        }

        window.onload = preloadAssets;
    </script>
</body>
</html>
